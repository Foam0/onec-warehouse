name: BSL and metadata checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned OneScript and BSL Language Server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools reports
          curl -fsSL --retry 3 -o .tools/onescript.zip https://github.com/EvilBeaver/OneScript/releases/download/v2.2.0/OneScript-2.2.0-linux-x64.zip
          echo '3b3b0a96e141d6758b74cbf492d5e5c11823bfd92318caff1aaa19bd500f1df7  .tools/onescript.zip' | sha256sum -c -
          unzip -q .tools/onescript.zip -d .tools/onescript
          chmod +x .tools/onescript/bin/oscript
          curl -fsSL --retry 3 -o .tools/bsl-language-server.jar https://github.com/1c-syntax/bsl-language-server/releases/download/v1.0.7/bsl-language-server-1.0.7-exec.jar
          echo '9f62765edd344d66456da24c906eaf623a03c56e90e5aafee466200100909f64  .tools/bsl-language-server.jar' | sha256sum -c -
      - name: Check metadata references and source completeness
        run: python3 scripts/check_metadata.py
      - name: Execute actual BSL business rules
        run: .tools/onescript/bin/oscript tests/run.os
      - name: Analyze BSL modules
        run: |
          java -jar .tools/bsl-language-server.jar analyze -s src -o reports -r json
          python3 scripts/check_bsl_report.py reports/bsl-json.json
